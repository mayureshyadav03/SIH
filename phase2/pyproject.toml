[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris"
version = "0.1.0"
description = "AI-Enabled Antarctic Sea Ice and Iceberg Trajectory & Navigation Decision Support System"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "numpy",
    "rasterio",
    "opencv-python",
    "pandas",
    "scipy",
    "shapely",
    "geopandas",
    "scikit-learn",
    "requests",
    "httpx",
    "matplotlib",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["polaris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
