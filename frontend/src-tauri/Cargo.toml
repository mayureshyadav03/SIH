[package]
name = "polaris-antarctic-dss"
version = "1.0.0"
description = "POLARIS Antarctic Navigation Decision Support System"
edition = "2021"

[lib]
name = "polaris_antarctic_dss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
